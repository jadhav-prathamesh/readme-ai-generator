[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-ai-generator"
version = "0.1.0"
description = "An AI-powered README generator for local projects and GitHub repositories using Claude"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
readme-ai = "readme_ai.cli:main"
